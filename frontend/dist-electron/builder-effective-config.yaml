directories:
  output: dist-electron
  buildResources: build
appId: com.aura.desktop
productName: AURA
files:
  - filter:
      - dist/**/*
      - electron/**/*
extraResources:
  - from: ../backend
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__'
      - '!**/*.pyc'
win:
  icon: build/icon.ico
linux:
  icon: build/icons
  target:
    - AppImage
    - deb
electronVersion: 41.7.1
